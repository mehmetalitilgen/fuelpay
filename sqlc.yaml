version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: db
        out: internal/postgres/db
        sql_package: pgx/v5
        emit_methods_with_db_argument: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
